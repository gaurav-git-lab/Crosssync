name: crosssync_mobile
description: CrossSync Android Mobile Application built with Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  crypto: ^3.0.3
  encrypt: ^5.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
