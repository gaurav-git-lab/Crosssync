[package]
name = "crosssync-desktop"
version = "1.0.0"
description = "CrossSync Windows Desktop App powered by Tauri"
authors = ["CrossSync Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
arboard = "3.3"
btleplug = "0.11"
tokio-tungstenite = "0.21"
futures-util = "0.3"
windows = { version = "0.54", features = ["Devices_Radios", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Power"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
