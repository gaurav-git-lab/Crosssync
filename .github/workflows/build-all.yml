name: Build CrossSync (Windows .EXE & Android .APK)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 💻 JOB 1: Build Windows Desktop App (.exe / .msi)
  # ==========================================
  build-windows-desktop:
    name: Build Windows Desktop (.exe / .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Generate Desktop App Icons
        run: node ./scripts/generate-icons.cjs

      - name: Install Root Frontend Dependencies
        run: npm install

      - name: Build Web Frontend Assets
        run: npm run build

      - name: Install Desktop Dependencies
        working-directory: ./desktop
        run: npm install

      - name: Build Windows Tauri App (.exe / .msi)
        working-directory: ./desktop
        run: npx @tauri-apps/cli build

      - name: Upload Windows NSIS Setup (.exe) & MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: CrossSync-Windows-Installer-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/crosssync-desktop.exe
          if-no-files-found: warn

  # ==========================================
  # 📱 JOB 2: Build Android Mobile Companion (.apk)
  # ==========================================
  build-android-apk:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Generate Mobile App Icons
        run: node ./scripts/generate-icons.cjs

      - name: Initialize Android Skeleton & Dependencies
        working-directory: ./mobile
        run: |
          if [ ! -d "android" ]; then
            echo "Creating Flutter Android wrapper..."
            flutter create . --platforms=android --org=com.crosssync
          fi
          flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: CrossSync-Android-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
