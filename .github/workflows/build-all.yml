name: Build CrossSync (Windows .EXE & Android .APK)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 💻 JOB 1: Build Windows Desktop App (.exe / .msi)
  # ==========================================
  build-windows-desktop:
    name: Build Windows Desktop (.exe / .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Generate Desktop App Icons
        run: node ./scripts/generate-icons.cjs

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Web Frontend Assets
        run: npm run build

      - name: Build Windows Tauri App (.exe / NSIS Installer)
        run: npx @tauri-apps/cli build --bundles nsis

      - name: Upload Windows NSIS Setup (.exe) & Binaries
        uses: actions/upload-artifact@v4
        with:
          name: CrossSync-Windows-Installer-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ==========================================
  # 📱 JOB 2: Build Android Mobile Companion (.apk)
  # ==========================================
  build-android-apk:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Mobile App Icons
        run: node ./scripts/generate-icons.cjs

      - name: Prepare Flutter Android Project
        working-directory: ./mobile
        run: |
          mkdir -p assets/icons
          flutter create . --platforms=android --org=com.crosssync --project-name=crosssync_mobile --overwrite
          flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: CrossSync-Android-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

  # ==========================================
  # 🚀 JOB 3: Publish GitHub Release (When Tagged)
  # ==========================================
  publish-release:
    name: Create GitHub Release with Binaries
    needs: [build-windows-desktop, build-android-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: CrossSync-Windows-Installer-x64
          path: release-binaries/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: CrossSync-Android-Release-APK
          path: release-binaries/android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-binaries/windows/*.exe
            release-binaries/windows/*.msi
            release-binaries/android/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
